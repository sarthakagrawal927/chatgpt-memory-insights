name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Qualify synthetic import and recovery
        timeout-minutes: 10
        env:
          MEMORY_MAP_TRACE_ARTIFACT_DIR: ${{ runner.temp }}/memory-map-qualification
        run: pnpm run test:import
      - name: Qualify on-demand aggregate demo
        env:
          MEMORY_MAP_DEMO_ARTIFACT_DIR: ${{ runner.temp }}/memory-map-qualification
        run: pnpm run test:demo
      - name: Retain build and qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: memory-map-build-${{ github.sha }}
          path: |
            dist/
            ${{ runner.temp }}/memory-map-qualification/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
